name: desktop-build

# Builds the Nori Desktop (Electron) installers for macOS, Windows and Linux.
# Each runner bundles the server worker into Electron, then packages it with
# electron-builder.
#
# macOS is signed with a Developer ID certificate + notarized (so it opens on
# any Mac without the "app is damaged" Gatekeeper block) when `sign-macos` is
# true and both Apple secrets are configured. If a credential is missing the job
# warns and builds unsigned rather than failing, so one absent secret cannot take
# down a release that also carries the Windows and Linux artifacts.
# Windows/Linux ship unsigned in v1.
#
# Triggered two ways:
#   - workflow_dispatch: manual ad-hoc builds from the Actions tab.
#   - workflow_call:     called by the release workflows to attach installers.
on:
  workflow_dispatch:
    inputs:
      sign-macos:
        description: 'Sign + notarize macOS (needs Apple secrets)'
        required: false
        type: boolean
        default: true
      retention-days:
        description: 'Artifact retention in days'
        required: false
        type: number
        default: 5
      upload-artifact-prefix:
        description: 'Prefix for uploaded artifact name'
        required: false
        type: string
        default: 'nori-work'
  workflow_call:
    inputs:
      sign-macos:
        description: 'Sign + notarize macOS (needs Apple secrets)'
        required: false
        type: boolean
        default: false
      retention-days:
        description: 'Artifact retention in days'
        required: false
        type: number
        default: 7
      upload-artifact-prefix:
        description: 'Prefix for uploaded artifact name'
        required: false
        type: string
        default: 'nori-work'
    secrets:
      APPLE_CERTIFICATE_P12:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_NOTARIZATION_KEY_P8:
        required: false
      APPLE_NOTARIZATION_KEY_ID:
        required: false
      APPLE_NOTARIZATION_ISSUER_ID:
        required: false

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop installer (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: darwin-arm64
          - os: macos-15-intel
            target: darwin-x64
          - os: windows-2025-vs2026
            target: win32-x64
          - os: ubuntu-24.04
            target: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Nori web assets
        run: pnpm --filter @nori-code/nori-web run build

      - name: Decide macOS signing
        id: signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          SIGN_REQUESTED: ${{ inputs.sign-macos }}
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
        run: |
          set -euo pipefail
          # Signing needs both halves: the Developer ID certificate to sign with and
          # the notary key to staple. A signed-but-unnotarized app is still refused by
          # Gatekeeper, so a partial credential set counts as unsigned. Fall back with
          # a warning instead of failing the job — a missing secret must not take the
          # whole release down, Windows and Linux artifacts included.
          if [[ "$SIGN_REQUESTED" != 'true' ]]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          elif [[ -n "$APPLE_CERTIFICATE_P12" && -n "$APPLE_NOTARIZATION_KEY_P8" ]]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            missing=()
            if [[ -z "$APPLE_CERTIFICATE_P12" ]]; then missing+=(APPLE_CERTIFICATE_P12); fi
            if [[ -z "$APPLE_NOTARIZATION_KEY_P8" ]]; then missing+=(APPLE_NOTARIZATION_KEY_P8); fi
            echo "::warning title=macOS build is unsigned::Signing was requested but ${missing[*]} is not configured. The dmg and zip are built unsigned, and Gatekeeper will refuse them as damaged on any other Mac."
          fi

      - name: Setup macOS keychain (Developer ID)
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        uses: ./.github/actions/macos-keychain-setup
        with:
          certificate-p12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Prepare CSC_NAME for electron-builder (macOS)
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        shell: bash
        run: |
          # electron-builder rejects the "Developer ID Application: " prefix in
          # CSC_NAME; strip it so the certificate matches by team name + ID.
          name="${APPLE_SIGNING_IDENTITY}"
          name="${name#Developer ID Application: }"
          echo "CSC_NAME=$name" >> "$GITHUB_ENV"

      - name: Prepare notarization API key (macOS)
        if: runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          APPLE_NOTARIZATION_KEY_P8: ${{ secrets.APPLE_NOTARIZATION_KEY_P8 }}
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/notary-AuthKey.p8"
          printf '%s' "$APPLE_NOTARIZATION_KEY_P8" | base64 -d > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"

      - name: Build & package desktop app
        shell: bash
        env:
          # macOS signing is driven by env: when signing is enabled, electron-builder
          # signs with the keychain's Developer ID and notarizes via the notary
          # API key; otherwise it builds unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ steps.signing.outputs.enabled == 'true' && 'true' || 'false' }}
          CSC_KEYCHAIN: ${{ env.APPLE_KEYCHAIN_PATH }}
          NORI_DESKTOP_NOTARIZE: ${{ steps.signing.outputs.enabled == 'true' && 'true' || 'false' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARIZATION_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARIZATION_ISSUER_ID }}
        run: pnpm --filter @nori-code/nori-work run dist --publish=never

      - name: Verify packaged runtime
        run: pnpm --filter @nori-code/nori-work run test:packaged-runtime

      - name: Cleanup macOS keychain
        if: always() && runner.os == 'macOS' && steps.signing.outputs.enabled == 'true'
        uses: ./.github/actions/macos-keychain-cleanup

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.upload-artifact-prefix }}-${{ matrix.target }}
          retention-days: ${{ inputs.retention-days }}
          path: |
            apps/nori-desktop/dist-app/*.dmg
            apps/nori-desktop/dist-app/*.zip
            apps/nori-desktop/dist-app/*.exe
            apps/nori-desktop/dist-app/*.AppImage
            apps/nori-desktop/dist-app/*.deb
          if-no-files-found: error
