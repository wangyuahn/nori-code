packages:
  - packages/*
  - apps/*
  - apps/vis/server
  - apps/vis/web
  - docs

catalog:
  zod: 4.3.6

overrides:
  "ssh2@1.17.0>cpu-features": "-"
  "ssh2@1.17.0>nan": "-"

# Allow Electron's postinstall to extract its prebuilt binary and node-pty's
# install script to fetch or build the host-native terminal binding required by
# the Nori Work desktop release.
onlyBuiltDependencies:
  - electron
  - node-pty
