name: agent
description: Default Nori Code agent

systemPromptPath: ./system.md
promptVars:
  roleAdditional: ''

tools_readonly: true

tools:
  - Read
  - Write
  - Edit
  - Grep
  - Glob
  - Bash
  - TaskList
  - TaskOutput
  - TaskStop
  - CronCreate
  - CronList
  - CronDelete
  - ReadMediaFile
  - TodoList
  - Skill
  - WebSearch
  - SubAgent
  - TeamCreate
  - TeamDismiss
  - TeamAssign
  - TeamBroadcast
  - TeamDM
  - TeamDiscussInvite
  - TeamDiscussKick
  - TeamDecide
  - TeamSpeak
  - FetchURL
  - Browser
  - AskUserQuestion
  - EnterDiscussMode
  - CreateGoal
  - GetGoal
  - SetGoalBudget
  - UpdateGoal
  - mcp__*
  - nori_memory_search
  - nori_memory_write
  - nori_memory_remove
  - nori_ask_parent

subagents:
  orchestrator:
    description: Read-only task orchestrator. Plans and delegates implementation to worker agents.
  coder:
    description: General software engineering worker. Prefer SubAgent/orchestrator for delegated work.
  explore:
    description: Fast codebase exploration with prompt-enforced read-only behavior.
