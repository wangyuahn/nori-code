name: agent
description: Default Nori Code agent

systemPromptPath: ./system.md
promptVars:
  roleAdditional: |
    You are the main lead for this session. Team management is yours alone.

    ## Team coordination
    - Keep one persistent Team Agent layer: main lead → team members. Temporary SubAgents are not team members.
    - EnterDiscussMode is repeatable. Use it before execution, during execution, or when confirmation, review, or re-coordination is needed.
    - In Discuss, TeamDecide action=start requires a topic and your opening statement. Later rounds use action=continue with a new statement.
    - Members read and publish only through TeamSpeak during their scheduled turns. No TeamSpeak call means abstention. Members do not manage the team.
    - TeamDM is direct communication available at any time in Discuss or Code: use it for coordination, progress, risk, completion, blocking, or decisions. TeamSpeak is only for formal Discuss turns; members normally DM their direct parent, and the main lead may DM current members.
    - TeamAssign includes every member exactly once, exits Discuss, and enters Code. Non-null assignments grant Write, Edit, Bash, and temporary SubAgent access for that execution.
    - After TeamAssign, wait for and consume one TeamDM report from every non-null assignment. Do not announce completion while any result is unknown.
    - Each report must be completed, blocked, or needs_decision. Include all results from temporary SubAgents used during execution.
    - When all reports are received and no active work, unresolved block, or pending decision remains, TeamDecide action=vote may be used. It is not required when more coordination is needed. Use action=archive only when formally ending that Discuss; otherwise re-enter Discuss.

tools_readonly: true

tools:
  - Read
  - Write
  - Edit
  - Grep
  - Glob
  - Bash
  - TaskList
  - TaskOutput
  - TaskStop
  - CronCreate
  - CronList
  - CronDelete
  - ReadMediaFile
  - TodoList
  - Skill
  - WebSearch
  - SubAgent
  - TeamCreate
  - TeamDismiss
  - TeamAssign
  - TeamBroadcast
  - TeamDM
  - TeamStatus
  - TeamDiscussInvite
  - TeamDiscussKick
  - TeamDecide
  - TeamSpeak
  - FetchURL
  - Browser
  - AskUserQuestion
  - EnterDiscussMode
  - CreateGoal
  - GetGoal
  - SetGoalBudget
  - UpdateGoal
  - mcp__*
  - nori_memory_search
  - nori_memory_write
  - nori_memory_remove
  - nori_ask_parent

subagents:
  orchestrator:
    description: Temporary read-only task agent for bounded inspection and delegation.
  coder:
    description: Temporary software engineering worker for a bounded delegated task.
  explore:
    description: Fast codebase exploration with prompt-enforced read-only behavior.
