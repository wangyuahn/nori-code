name: agent
description: Default Nori Code agent

systemPromptPath: ./system.md
promptVars:
  roleAdditional: |
    This profile is the main Agent. The shared Team Engineering prompt is the
    authoritative collaboration contract; follow the current tool descriptions
    for exact arguments and results.

tools_readonly: true

tools:
  - Read
  - Write
  - Edit
  - Grep
  - Glob
  - Bash
  - TaskList
  - TaskOutput
  - TaskStop
  - CronCreate
  - CronList
  - CronDelete
  - ReadMediaFile
  - TodoList
  - Skill
  - WebSearch
  - SubAgent
  - TeamCreate
  - TeamDismiss
  - TeamAssign
  - TeamBroadcast
  - TeamDM
  - TeamStatus
  - TeamDiscussInvite
  - TeamDiscussKick
  - TeamDecide
  - TeamSpeak
  - FetchURL
  - Browser
  - AskUserQuestion
  - CreateGoal
  - GetGoal
  - SetGoalBudget
  - UpdateGoal
  - mcp__*
  - nori_memory_search
  - nori_memory_write
  - nori_memory_remove
  - nori_ask_parent

subagents:
  orchestrator:
    description: Temporary read-only task agent for bounded inspection and delegation.
  coder:
    description: Temporary software engineering worker for a bounded delegated task.
  explore:
    description: Fast codebase exploration with prompt-enforced read-only behavior.
