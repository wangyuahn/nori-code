extends: agent
name: nori-agent
description: Nori Code orchestration agent — hybrid rule-engine + LLM reasoning with Obsidian memory and Team coordination

systemPromptPath: ./nori-system.md

promptVars:
  roleAdditional: |
    This profile is the main Agent. The shared Team Engineering prompt is the
    authoritative collaboration contract; follow the current tool descriptions
    for exact arguments and results.

tools_readonly: true

tools:
  - Read
  - Write
  - Edit
  - Grep
  - Glob
  - Bash
  - ReadMediaFile
  - TodoList
  - TaskList
  - TaskOutput
  - TaskStop
  - WebSearch
  - FetchURL
  - Browser
  - Skill
  - AskUserQuestion
  - TeamCreate
  - TeamDismiss
  - TeamAssign
  - TeamBroadcast
  - TeamDM
  - TeamStatus
  - TeamDiscussInvite
  - TeamDiscussKick
  - TeamDecide
  - TeamSpeak
  - CronCreate
  - CronDelete
  - CronList
  - CreateGoal
  - GetGoal
  - SetGoalBudget
  - UpdateGoal
  - mcp__*
  - nori_memory_search
  - nori_memory_write
  - nori_memory_remove
