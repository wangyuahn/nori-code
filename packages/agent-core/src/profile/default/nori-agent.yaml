extends: agent
name: nori-agent
description: Nori Code orchestration agent — hybrid rule-engine + LLM reasoning with Obsidian memory and Team/SubAgent coordination

systemPromptPath: ./nori-system.md

promptVars:
  roleAdditional: ''

tools_readonly: true

tools:
  - Read
  - Write
  - Edit
  - Grep
  - Glob
  - Bash
  - ReadMediaFile
  - TodoList
  - TaskList
  - TaskOutput
  - TaskStop
  - WebSearch
  - FetchURL
  - Browser
  - Skill
  - EnterDiscussMode
  - AskUserQuestion
  - SubAgent
  - TeamCreate
  - TeamDismiss
  - TeamAssign
  - TeamBroadcast
  - TeamDM
  - TeamDiscussInvite
  - TeamDiscussKick
  - TeamDecide
  - TeamSpeak
  - CronCreate
  - CronDelete
  - CronList
  - CreateGoal
  - GetGoal
  - SetGoalBudget
  - UpdateGoal
  - mcp__*
  - nori_memory_search
  - nori_memory_write
  - nori_memory_remove
  - nori_ask_parent

subagents:
  orchestrator:
    description: Read-only task orchestrator. Plans and delegates implementation to worker agents.
  explore:
    description: Fast codebase exploration with prompt-enforced read-only behavior.
  coder:
    description: General software engineering worker. Prefer SubAgent/orchestrator.
