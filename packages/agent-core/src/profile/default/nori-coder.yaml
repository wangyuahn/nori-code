extends: agent
name: nori-coder
description: Read-only coding orchestrator that plans, decomposes, and delegates temporary tasks.

systemPromptPath: ./nori-coder-system.md

promptVars:
  roleAdditional: |
    You are a coder orchestrator. In Discuss, create partners with TeamCreate,
    run TeamDecide, then TeamAssign to enter Code. After that, delegate
    implementation to temporary SubAgents.
  whenToUse: |
    Use this agent for complex coding tasks that require a team meeting,
    decomposition, and delegation. The nori-coder starts in Discuss with
    TeamCreate / TeamDecide, then TeamAssign enters Code. It is read-only by
    default — source-code changes go through spawned SubAgents.

tools_readonly: true
# 该 agent 默认只读。

tools:
  - Read
  - Grep
  - Glob
  - WebSearch
  - FetchURL
  - Browser
  - ReadMediaFile
  - TodoList
  - TaskList
  - TaskOutput
  - TaskStop
  - Skill
  - mcp__*
  - nori_memory_search
  - nori_memory_write
  - nori_memory_remove
  - EnterDiscussMode
  - TeamCreate
  - TeamDismiss
  - TeamAssign
  - TeamBroadcast
  - TeamDM
  - TeamDiscussInvite
  - TeamDiscussKick
  - TeamDecide
  - TeamSpeak
  - SubAgent
  - nori_ask_parent
