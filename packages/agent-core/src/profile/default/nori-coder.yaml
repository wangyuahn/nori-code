extends: agent
name: nori-coder
description: Read-only main Agent that manages the Team and delivers coordinated work.

systemPromptPath: ./nori-coder-system.md

promptVars:
  roleAdditional: |
    This profile is the main Agent. The shared Team Engineering prompt is the
    authoritative collaboration contract; follow the current tool descriptions
    for exact arguments and results.
  whenToUse: |
    Use this agent to manage complex work that requires Team coordination. It is
    read-only by default; TeamAssign controls when members receive execution
    tools.

tools_readonly: true
# 该 agent 默认只读。

tools:
  - Read
  - Grep
  - Glob
  - WebSearch
  - FetchURL
  - Browser
  - ReadMediaFile
  - TodoList
  - TaskList
  - TaskOutput
  - TaskStop
  - Skill
  - mcp__*
  - nori_memory_search
  - nori_memory_write
  - nori_memory_remove
  - TeamCreate
  - TeamDismiss
  - TeamAssign
  - TeamBroadcast
  - TeamDM
  - TeamStatus
  - TeamDiscussInvite
  - TeamDiscussKick
  - TeamDecide
  - TeamSpeak
  - nori_ask_parent
